<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistente Anti-Truffa</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <div class="max-w-xl w-full mx-auto p-4 sm:p-6 mt-10 bg-white rounded-2xl shadow-sm border border-slate-100">
        <h1 class="text-2xl font-bold text-slate-900 text-center mb-2">Verifica Messaggio Sospetto</h1>
        <p class="text-sm text-slate-500 text-center mb-6">Incolla qui SMS, email o WhatsApp per scoprire se si tratta di una truffa.</p>

        <textarea id="messaggio" rows="5" class="w-full p-4 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm resize-none" placeholder="Esempio: 'Gentile cliente, il suo conto è bloccato, clicchi qui per sbloccare...'"></textarea>

        <button onclick="verificaMessaggio()" id="btnVerifica" class="w-full mt-4 bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl transition duration-200">
            Analizza Messaggio
        </button>

        <!-- Risultato -->
        <div id="risultato" class="hidden mt-6 p-4 rounded-xl border">
            <div id="badgeRischio" class="inline-block px-3 py-1 rounded-full text-xs font-bold mb-2"></div>
            <p id="testoSpiegazione" class="text-sm text-slate-700 mb-3"></p>
            <div class="bg-slate-50 p-3 rounded-lg border border-slate-200">
                <span class="text-xs font-bold text-slate-500 block uppercase">Cosa fare:</span>
                <p id="testoAzione" class="text-sm font-medium text-slate-900"></p>
            </div>
        </div>

        <p class="text-xs text-slate-400 text-center mt-6">🔒 I tuoi dati non vengono memorizzati. Analisi protetta nel rispetto della privacy.</p>
    </div>

    <script>
        async function verificaMessaggio() {
            const testo = document.getElementById('messaggio').value;
            const btn = document.getElementById('btnVerifica');
            const boxRisultato = document.getElementById('risultato');
            
            if (!testo.trim()) {
                alert('Inserisci del testo prima di verificare.');
                return;
            }

            btn.disabled = true;
            btn.innerText = 'Analisi in corso...';
            boxRisultato.classList.add('hidden');

            try {
                const response = await fetch('/analizza', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ testo })
                });

                const data = await response.json();
                
                if (response.ok) {
                    document.getElementById('testoSpiegazione').innerText = data.spiegazione;
                    document.getElementById('testoAzione').innerText = data.azione_consigliata;
                    
                    const badge = document.getElementById('badgeRischio');
                    boxRisultato.className = "mt-6 p-4 rounded-xl border";
                    
                    if (data.livello_rischio === "Alto") {
                        badge.className = "inline-block px-3 py-1 rounded-full text-xs font-bold mb-2 bg-red-100 text-red-700";
                        badge.innerText = "🔴 ALTO RISCHIO DI TRUFFA";
                        boxRisultato.classList.add("bg-red-50", "border-red-200");
                    } else if (data.livello_rischio === "Sospetto") {
                        badge.className = "inline-block px-3 py-1 rounded-full text-xs font-bold mb-2 bg-amber-100 text-amber-700";
                        badge.innerText = "🟡 ATTENZIONE - MESSAGGIO DUBBIO";
                        boxRisultato.classList.add("bg-amber-50", "border-amber-200");
                    } else {
                        badge.className = "inline-block px-3 py-1 rounded-full text-xs font-bold mb-2 bg-emerald-100 text-emerald-700";
                        badge.innerText = "🟢 RISCHIO BASSO";
                        boxRisultato.classList.add("bg-emerald-50", "border-emerald-200");
                    }
                    
                    boxRisultato.classList.remove('hidden');
                } else {
                    alert(data.errore || 'Errore imprevisto.');
                }
            } catch (err) {
                alert('Errore di connessione al server.');
            } finally {
                btn.disabled = false;
                btn.innerText = 'Analizza Messaggio';
            }
        }
    </script>
</body>
</html>
